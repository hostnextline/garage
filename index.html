<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#E9DED2"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1915"><meta name="apple-mobile-web-app-title" content="Garage essai"><link rel="preconnect" href="https://photon.komoot.io" crossorigin><link rel="preconnect" href="https://api.tomtom.com" crossorigin><link rel="preconnect" href="https://maps.googleapis.com"><style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet du garage mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a mechanic's clipboard: sticky day header, job tickets with a perforated time stub, thumb-reach tab bar at the bottom */
:root{
  --paper:#ECEFF2; --surface:#FFFFFF; --sunk:#E2E7EC; --ink:#14202B; --muted:#55626F; --line:#D2D9E0; --line-strong:#B4BEC8; --line-faint:#E9EDF0;
  --signal:#F2B200; --on-signal:#1E1600; --steel:#1D4B77; --on-steel:#FFFFFF; --steel-soft:#DCE7F3;
  --ok:#1B6E45; --ok-bg:#DCF0E3; --warn:#8F5400; --warn-bg:#FBEACB; --bad:#AE2116; --bad-bg:#FADFDB;
  --info:#1D5CA3; --info-bg:#DCE8F7; --idle:#55626F; --idle-bg:#E2E7EC; --closed-a:#E3E7EB; --closed-b:#F1F3F5; --scrim:rgba(14,19,24,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1318; --surface:#172029; --sunk:#111920; --ink:#E6ECF1; --muted:#97A5B2; --line:#26323D; --line-strong:#3A4855; --line-faint:#1D2630;
    --signal:#F4BE2A; --on-signal:#1E1600; --steel:#93BCE4; --on-steel:#0E1318; --steel-soft:#1C3046;
    --ok:#5CCB93; --ok-bg:#15321F; --warn:#F2AE45; --warn-bg:#382709; --bad:#F2796D; --bad-bg:#3A1714;
    --info:#7DB2EC; --info-bg:#14273D; --idle:#97A5B2; --idle-bg:#1E2832; --closed-a:#1A222B; --closed-b:#121921; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1318; --surface:#172029; --sunk:#111920; --ink:#E6ECF1; --muted:#97A5B2; --line:#26323D; --line-strong:#3A4855; --line-faint:#1D2630;
  --signal:#F4BE2A; --on-signal:#1E1600; --steel:#93BCE4; --on-steel:#0E1318; --steel-soft:#1C3046;
  --ok:#5CCB93; --ok-bg:#15321F; --warn:#F2AE45; --warn-bg:#382709; --bad:#F2796D; --bad-bg:#3A1714;
  --info:#7DB2EC; --info-bg:#14273D; --idle:#97A5B2; --idle-bg:#1E2832; --closed-a:#1A222B; --closed-b:#121921; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:14px}
.mono{font-family:var(--f-mono);letter-spacing:.03em}
.num{font-variant-numeric:tabular-nums}
.eyebrow,.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:14px}

/* top band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{display:grid;gap:12px;padding-block:14px 12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandrow>div{min-width:0}
.brandrow h1{overflow-wrap:anywhere}
.backrow{display:flex;align-items:center;gap:8px;min-width:0}
.backrow h1{font-size:24px;overflow-wrap:anywhere;min-width:0}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .month{font-family:var(--f-display);font-weight:600;font-size:17px;flex:1;text-transform:capitalize}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:grid;justify-items:center;gap:1px;padding:7px 0 6px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer}
.day .dw{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.day .dc{display:flex;gap:3px;height:6px;align-items:center}
.day .dc i{width:5px;height:5px;border-radius:50%;background:var(--signal)}
.day.today .dn{text-decoration:underline 3px var(--signal);text-underline-offset:4px}
.day.on{background:var(--ink);color:var(--paper)}
.day.on .dw{color:inherit;opacity:.75}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.15}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn.steel{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;font-size:20px;line-height:1}
.linkbtn{background:none;border:0;color:var(--steel);font-weight:600;cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;min-height:38px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed}

.field{display:grid;gap:6px;min-width:0}
.field>label{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font-size:16px;width:100%;min-height:46px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);min-width:0}
input[disabled],select[disabled],textarea[disabled]{background:var(--sunk);color:var(--muted)}
textarea{min-height:80px;resize:vertical}
input.mono{text-transform:uppercase}
input.mono::placeholder{text-transform:none;font-family:var(--f-body);letter-spacing:0}
.hint{font-size:14px;color:var(--muted);min-height:20px}
#hourmsg:empty{display:none}
.hint.ok{color:var(--ok)} .hint.warn{color:var(--warn)} .hint.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.veh{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:440px){.grid2.stack-sm{grid-template-columns:minmax(0,1fr)}}
@media (max-width:370px){.veh{grid-template-columns:84px minmax(0,1fr)}.veh .field:last-child{grid-column:1/-1}}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;min-height:40px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--steel)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:500}
.actions{display:grid;gap:10px}

/* sections & cards */
.sect{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.sect-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner{border-radius:10px;padding:12px 14px;background:var(--steel-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg)}
.banner p{min-width:0;flex:1 1 220px}
main.wrap{padding-block:16px 8px;display:grid;gap:16px}
.daytitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.daytitle h2::first-letter{text-transform:uppercase}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(18px,5vw,22px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:13px;color:var(--muted)}

.list{display:grid;gap:10px}
.ticket{display:grid;grid-template-columns:78px minmax(0,1fr);width:100%;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;overflow:hidden;color:var(--ink)}
.stub{display:grid;align-content:center;justify-items:center;gap:3px;padding:12px 6px;background:var(--sunk);border-right:2px dashed var(--line-strong)}
.stub b{font-family:var(--f-display);font-size:20px;white-space:nowrap;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stub small{font-size:12.5px;color:var(--muted)}
.ticket.s-route .stub{background:var(--info-bg)}
.ticket.s-place .stub{background:var(--warn-bg)}
.ticket.s-termine .stub{background:var(--ok-bg)}
.ticket.s-annule,.ticket.s-noshow{opacity:.62}
.ticket.s-annule .tk-name,.ticket.s-noshow .tk-name{text-decoration:line-through}
.tk{padding:12px 14px;display:grid;gap:2px;min-width:0}
.tk-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tk-name{font-weight:600;font-size:17px;overflow-wrap:anywhere;min-width:0}
.tk-veh{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.02em}
.tk-sub{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.tk-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--idle-bg);color:var(--idle)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.route{background:var(--info-bg);color:var(--info)}
.pill.place{background:var(--warn-bg);color:var(--warn)}
.pill.termine,.pill.paid{background:var(--ok-bg);color:var(--ok)}
.pill.annule,.pill.noshow{background:var(--bad-bg);color:var(--bad)}
.pill.unpaid{background:var(--warn-bg);color:var(--warn)}

.empty-card{background:var(--surface);border:2px dashed var(--line-strong);border-radius:14px;padding:22px 18px;display:grid;gap:12px;justify-items:start}
.empty-card p{max-width:60ch;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.steps div{background:var(--sunk);border-radius:10px;padding:10px;font-size:14px}
.steps b{display:block;font-family:var(--f-display);font-size:16px}
@media (max-width:480px){.steps{grid-template-columns:minmax(0,1fr)}}

/* job detail */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{min-height:52px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;padding:4px 2px;line-height:1.1}
.seg button.on.planifie{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button.on.route{background:var(--info);color:var(--surface);border-color:var(--info)}
.seg button.on.place{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.seg button.on.termine{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.kv{display:grid;gap:10px}
.kv>div{display:grid;gap:2px;min-width:0}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dt{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sel{user-select:all;-webkit-user-select:all}
.vin{font-family:var(--f-mono);font-size:17px;letter-spacing:.08em;overflow-wrap:anywhere}
.badge{font-size:13px;font-weight:600}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)}
.invbox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.invbox b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.when{font-family:var(--f-display);font-size:22px;font-weight:600}

/* invoice editor */
.line{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--paper)}
.line-top{display:flex;gap:8px;align-items:center}
.line-top select{flex:1}
.line-nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:end}
.amt{font-family:var(--f-display);font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;padding-bottom:10px;overflow-wrap:anywhere}
.addrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tot{margin:0;display:grid;gap:6px}
.tot>div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tot dt{color:var(--muted)} .tot dd{margin:0;font-weight:500}
.tot .grand{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.tot .grand dt,.tot .grand dd{color:var(--ink);font-family:var(--f-display);font-size:26px;font-weight:700}
.radio2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.radio2 label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;min-height:48px}
.radio2 input{width:20px;height:20px;min-height:0;accent-color:var(--steel)}
.radio2 label:has(input:checked){border-color:var(--steel);background:var(--steel-soft)}

/* invoice paper */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:18px}
.paper-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--signal);padding-bottom:14px}
.paper-head>div{min-width:0}
.paper-head h2{font-size:26px;overflow-wrap:anywhere}
.inv-no{text-align:right;display:grid;gap:2px;justify-items:end;margin-left:auto}
.inv-no b{font-family:var(--f-mono);font-size:18px}
.il{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.il-d{display:grid;gap:2px;min-width:0}
.il-d b{font-weight:600;overflow-wrap:anywhere}
.il-a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.stamp{border-radius:10px;padding:12px 14px;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.03em}
.stamp.ok{background:var(--ok-bg);color:var(--ok)} .stamp.warn{background:var(--warn-bg);color:var(--warn)}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* invoices list */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.row .r-no{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.row .r-name{font-weight:600;overflow-wrap:anywhere;min-width:0}
.row .r-amt{font-family:var(--f-display);font-size:21px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.row .r-meta{font-size:14px;color:var(--muted)}

/* service picker */
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px;min-height:46px}
.picker:focus-within{outline:3px solid var(--steel);outline-offset:2px}
.picker input{border:0;min-height:36px;padding:4px 6px;flex:1 1 170px;background:transparent}
.picker input:focus-visible{outline:none}
.picked{display:contents}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--steel-soft);color:var(--ink);border-radius:999px;padding:3px 3px 3px 12px;font-weight:600;font-size:15px;max-width:100%;overflow-wrap:anywhere}
.pchip small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip button{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px}
.pchip button:hover{background:var(--surface);color:var(--ink)}
.opts{display:grid;grid-auto-rows:max-content;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);overflow:hidden}
#svc-opts{position:relative;max-height:min(55vh,420px);overflow-y:auto;overscroll-behavior:contain}
label[for="f-svc-in"]{scroll-margin-top:96px}
#sheet-body label[for="f-svc-in"]{scroll-margin-top:12px}
#svc-est .est{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--steel-soft);color:var(--ink)}
#svc-est .est > div{display:grid;gap:2px;min-width:0}
#svc-est .est-miss{color:var(--warn)}
.opts .opt-count{position:sticky;top:0;z-index:1;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.opt mark{background:var(--signal-soft, rgba(242,178,0,.32));color:inherit;border-radius:3px;padding:0 1px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font-size:16px;min-height:48px;color:var(--ink)}
.opt:last-child{border-bottom:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.opt.active,.opt:hover{background:var(--sunk)}
.opt.new{color:var(--steel);font-weight:600}
.draftmsg{display:flex;align-items:center;gap:8px}
.draftmsg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.draftmsg.ok::before{background:var(--ok)} .draftmsg.bad::before{background:var(--bad)}
.draftmsg:empty{display:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{background:var(--sunk);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}

/* day schedule grid (dental-agenda style) */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hoursline{color:var(--muted);font-size:15px}
.hoursline b{color:var(--ink)}

.gutter{position:relative;position:sticky;left:0;z-index:3;background:var(--surface)}

.cal.week .appt{padding:3px 5px;font-size:12px}

.cal.week .slot{font-size:12px}
.hl{position:absolute;left:0;right:6px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px}
.col{position:relative;border-left:1px solid var(--line)}

.slot.open:hover,.slot.open:focus-visible{background:var(--steel-soft)}
.slot.open:hover::after,.slot.open:focus-visible::after{content:"+ Réserver"}
.slot.closed{background:repeating-linear-gradient(135deg,var(--closed-a) 0 6px,var(--closed-b) 6px 12px);cursor:not-allowed}
.slot:focus-visible{outline-offset:-3px}
.cal.editing .slot{cursor:pointer}
.cal.editing .slot.open{background:var(--ok-bg)}
.cal.editing .slot.open:hover::after{content:"Fermer"}
.cal.editing .slot.closed:hover::after{content:"Ouvrir"}
.appt{position:absolute;display:grid;align-content:start;gap:1px;padding:4px 7px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);text-align:left;overflow:hidden;font-size:13px;line-height:1.25;cursor:pointer;color:var(--ink);z-index:1;min-width:0}

.appt.s-planifie{background:var(--steel-soft);border-color:var(--steel)}
.appt.s-route{background:var(--info-bg);border-color:var(--info)}
.appt.s-place{background:var(--warn-bg);border-color:var(--warn)}
.appt.s-termine{background:var(--ok-bg);border-color:var(--ok)}
.cal.editing .appt{pointer-events:none;opacity:.4}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-1px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line-strong);background:var(--surface)}
.legend i.cl{background:repeating-linear-gradient(135deg,var(--closed-a) 0 3px,var(--closed-b) 3px 6px)}
.hours-panel{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:14px;display:grid;gap:12px}
.hours-panel .row2{display:flex;flex-wrap:wrap;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto 96px;gap:8px;align-items:center}
.hrow select{min-height:42px;padding:6px 8px}
body.locked{overflow:hidden}
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:620px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);background:var(--paper);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}

.sheet-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* postal-code optimisation */
.addrwrap{position:relative}
.addrsug{margin-top:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:min(60vh,440px);overflow-y:auto;overscroll-behavior:contain}
.addrsug .opt{display:grid;gap:2px;justify-content:stretch}

.addrsug .opt-head{position:sticky;top:0;z-index:1;padding:8px 14px 6px;font:600 12.5px/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.addrsug .opt-wait{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--muted);font-size:15px;border-bottom:1px solid var(--line)}

@keyframes gmspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.addrsug .spin{animation-duration:2s}}
.addrsug .src{padding:6px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--sunk)}
.ttnote{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ttnote:empty{display:none}
.sugbox{border:1px solid var(--steel);background:var(--steel-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.sug-head{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.sugs{display:grid;gap:8px}
.sug{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:10px 12px;cursor:pointer;color:var(--ink);font-size:16px}
.sug:hover{border-color:var(--steel)}

.sug-when{grid-column:1;grid-row:1;font-weight:600}

.sug-why{grid-column:1;grid-row:2;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.km{grid-column:2;grid-row:1 / span 2;font-family:var(--f-display);font-weight:700;font-size:18px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.km.good{background:var(--ok-bg);color:var(--ok)} .km.mid{background:var(--warn-bg);color:var(--warn)} .km.far{background:var(--idle-bg);color:var(--idle)}
.moment{font-size:14.5px;border-radius:8px;padding:8px 10px;font-weight:500}
.moment.ok{background:var(--ok-bg);color:var(--ok)} .moment.mid{background:var(--warn-bg);color:var(--warn)} .moment.bad{background:var(--bad-bg);color:var(--bad)} .moment.far{background:var(--idle-bg);color:var(--ink)}
.moment:empty{display:none}
.trip{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}

.tight{color:var(--warn);font-size:14px;font-weight:600;margin:0}

/* duration in units */
.stepper{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px;align-items:center}

.stepper input{text-align:center;font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.period{display:grid;gap:8px;border-top:1px solid var(--warn);padding-top:12px}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prow select{width:auto;min-width:96px;min-height:42px;padding:6px 8px;flex:1 1 96px}

/* clients */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;color:var(--ink)}
.crow:hover{border-color:var(--line-strong)}
.crow-main{display:grid;gap:1px;min-width:0}
.crow-main b{font-size:17px;overflow-wrap:anywhere}
.crow-main span{overflow-wrap:anywhere}
.crow-side{display:grid;gap:4px;justify-items:end}
.ccard{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.tile svg{width:22px;height:22px}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.vrow .vdate{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}

.vrow .vmain span{overflow-wrap:anywhere}
.note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.due-big{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.rec{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px}
.rec-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.dayboxes{display:flex;flex-wrap:wrap;gap:2px 14px}
.daybox{min-height:36px}

/* settings */
.promo-row{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}

.opt.promo{flex-direction:column;align-items:stretch;gap:4px}
.opt.promo small{color:var(--ink);font-weight:600}
.chip.add.promo{border-color:var(--signal);background:var(--signal);color:var(--on-signal);font-weight:600}

/* tab bar + toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding-block:6px}

.tab[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.tab[aria-current="page"] svg{color:var(--signal)}

@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}}

/* ===================== Glass look =====================
   Frosted panels over a warm, softly lit backdrop (light) or a smoky night garage (dark).
   Big panels blur what is behind them; repeated small cards are translucent without blur (lighter for phones). */
:root{
  --f-display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#F7F1EA; --surface:rgba(255,255,255,.66); --surface-solid:#FFFCF9; --sunk:rgba(110,85,65,.07); --ink:#1E1915; --muted:#6B5E55;
  --line:rgba(110,85,65,.13); --line-strong:rgba(110,85,65,.25); --line-faint:rgba(110,85,65,.07);
  --signal:#EE6A2F; --on-signal:#1A0E06; --steel:#1E1915; --on-steel:#FFFFFF; --steel-soft:rgba(255,255,255,.58);
  --ok:#1C7A4B; --ok-bg:rgba(52,168,99,.17); --warn:#9E4F06; --warn-bg:rgba(245,158,45,.22); --bad:#B3261E; --bad-bg:rgba(229,72,55,.15);
  --info:#2257A8; --info-bg:rgba(66,128,228,.16); --idle:#6B5E55; --idle-bg:rgba(110,85,65,.10);
  --closed-a:rgba(110,85,65,.10); --closed-b:rgba(110,85,65,.03); --scrim:rgba(40,24,12,.30);
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,253,250,.86); --card:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.78);
  --glass-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 12px 34px rgba(80,48,22,.12);
  --card-shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 4px 14px rgba(80,48,22,.08);
  --blur:saturate(165%) blur(22px);
  --accent:linear-gradient(135deg,#F7974F 0%,#E9572A 100%);
  --r:14px;
  --scene:
    radial-gradient(38% 32% at 10% 6%, rgba(255,238,218,.95), transparent 70%),
    radial-gradient(34% 34% at 94% 12%, rgba(226,184,146,.80), transparent 70%),
    radial-gradient(42% 36% at 82% 82%, rgba(240,138,80,.34), transparent 72%),
    radial-gradient(44% 40% at 6% 90%, rgba(148,170,192,.42), transparent 70%),
    linear-gradient(165deg,#F4ECE4 0%,#E7D7C7 48%,#D6BFA8 100%);
  --scene-base:#E9DED2;
}

    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18); --line-faint:rgba(255,255,255,.05);
    --signal:#FF7B3E; --on-signal:#1A0E06; --steel:#F5EFE9; --on-steel:#15110E; --steel-soft:rgba(255,255,255,.08);
    --ok:#62D59C; --ok-bg:rgba(98,213,156,.14); --warn:#F7B45E; --warn-bg:rgba(247,180,94,.15); --bad:#FF8C7C; --bad-bg:rgba(255,140,124,.14);
    --info:#8FBAF6; --info-bg:rgba(143,186,246,.14); --idle:#B8AA9F; --idle-bg:rgba(255,255,255,.07);
    --closed-a:rgba(255,255,255,.07); --closed-b:rgba(255,255,255,.02); --scrim:rgba(0,0,0,.55);
    --glass:rgba(36,30,27,.55); --glass-strong:rgba(30,25,22,.88); --card:rgba(40,34,30,.74); --glass-edge:rgba(255,255,255,.10);
    --glass-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 14px 38px rgba(0,0,0,.40);

:root[data-theme="dark"]{
  --paper:#15110E; --surface:rgba(40,34,30,.60); --surface-solid:#1D1815; --sunk:rgba(255,255,255,.05); --ink:#F5EFE9; --muted:#B8AA9F;

html{background:var(--scene-base)}
body{background:transparent;font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--scene)}
body::before{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h1,h2,h3{font-weight:700;letter-spacing:-.022em;line-height:1.08}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px;font-weight:650;letter-spacing:-.012em}
.eyebrow,.lbl{font:500 13px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.field>label{font:600 14px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink)}

}

.hz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hz:first-child{border-top:0}
.hz-d{display:grid;gap:1px;min-width:0}.hz-d b{font-weight:650}.hz-d span{font-size:14px;color:var(--muted)}
.hz.off .hz-d b{color:var(--muted)}
.hz-t{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.hz-t select{min-height:44px}
.switch{width:58px;height:34px;border-radius:999px;border:1px solid var(--line-strong);background:var(--sunk);position:relative;cursor:pointer;flex:none;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--signal);border-color:var(--signal)}
.switch[aria-checked="true"] i{left:27px}
.hzw{display:grid;gap:6px}.hz-w{display:flex;justify-content:space-between;gap:10px;font-size:15px}.hz-w span{color:var(--muted)}
.paybtns{display:flex;flex-wrap:wrap;gap:8px}
.paybtns .chip{min-height:48px;padding:10px 16px;font-size:16px}
@media (prefers-reduced-motion: reduce){.switch i,.fold summary::after{transition:none}}

/* ===================== Tableau de bord ===================== */
.dash{display:grid;gap:14px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.dash-hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.dash-hero{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:520px){.hero-in{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:end}}
.kpi-big{font:700 clamp(34px,10vw,46px)/1 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:6px 0 8px;overflow-wrap:anywhere}
.delta{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--ok-bg);color:var(--ok)}
.delta.down{background:var(--bad-bg);color:var(--bad)} .delta.flat{background:var(--idle-bg);color:var(--idle)}
.kpi-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.pbar{height:8px;border-radius:99px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 5px);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--accent);min-width:6px}
.pbar-cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.bars-wrap{display:grid;gap:6px}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:136px}
.bar{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:end;gap:4px;height:100%}
.bar i{display:block;width:100%;max-width:34px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.62));border:1px solid var(--glass-edge);box-shadow:var(--card-shadow);min-height:6px}
.bar.cur i{background:repeating-linear-gradient(135deg,#F6965A 0 5px,#E8582A 5px 10px);border-color:transparent;box-shadow:0 6px 16px rgba(233,87,42,.30)}
.bar small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bar em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qrows{display:grid;gap:4px}
.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qicon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--card-shadow)}
.qicon svg{width:19px;height:19px}
.qicon.big{width:64px;height:64px;border-radius:22px}.qicon.big svg{width:30px;height:30px;color:var(--signal)}
.qrow b{display:block;font-weight:600;font-size:15px}
.qrow span{font-size:13px;color:var(--muted)}
.qnum{font:700 22px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.dot-route{color:var(--info)} .dot-place{color:var(--warn)} .dot-done{color:var(--ok)}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}

.ringcard h3{font-size:15px;font-weight:650}
.ringcard p{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--line)} .ring .val{stroke:var(--signal)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 20px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring b small{display:block;font:500 11px/1 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:3px}
.ring b span{display:grid;justify-items:center}
.mechs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mcard{display:grid;justify-items:center;gap:8px;text-align:center;padding:14px 12px}
.mcard .who{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font:700 13px/1 var(--f-body);background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--card-shadow)}
.mcard .when{font:600 12px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-edge);color:var(--muted)}
.mcard h3{font-size:15px}
.mcard p{font-size:13px;color:var(--muted)}
.mcard .btn{width:100%}
.mcard.add{border:1.5px dashed var(--line-strong);background:transparent;box-shadow:none;place-content:center;min-height:200px;cursor:pointer;color:var(--ink);font:inherit}

.nextlist{display:grid;gap:8px}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--glass-edge);box-shadow:var(--card-shadow);cursor:pointer;color:var(--ink)}

.nrow .m{min-width:0;display:grid;gap:1px}
.nrow .m b{font-weight:600;overflow-wrap:anywhere}
.nrow .m span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hbars{display:grid;gap:10px}
.hbar{display:grid;gap:4px}
.hbar .hl2{display:flex;justify-content:space-between;gap:10px;font-size:14px}

.hbar .trk2{height:8px;border-radius:99px;background:var(--line)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

  else if (has(/bougie/)) r = [1, 0.8, 3.5];

  else if (has(/purge|liquide de frein/)) r = [0.8, 0.6, 1];
  else if (has(/etrier/)) r = [1, 0.8, 1.5];
  else if (has(/ cable /)) r = [1, 0.8, 1.5];

/* ---------- PDF ---------- */
var jspdfP = null;
function loadJsPDF(){
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if (jspdfP) return jspdfP;
  jspdfP = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = function(){ res(); }; s.onerror = function(){ jspdfP = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return jspdfP;
}
function pdfSafe(s){ return String(s == null ? '' : s).replace(/[   ]/g, ' ').replace(/[‘’]/g, "'").replace(/[“”«»]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...'); }
function buildPdf(j){
  return loadJsPDF().then(function(){
    var doc = new window.jspdf.jsPDF({unit:'pt', format:'letter'});
    var v = j.invoice, b = biz(), cf = cfg(), c = cl(j), veh = j.vehicle || {};
    var W = 612, H = 792, M = 50, R = W - M, y = 64;
    function T(s, x, yy, o){ doc.text(pdfSafe(s), x, yy, o); }
    function ink(){ doc.setTextColor(20, 32, 43); }
    function gray(){ doc.setTextColor(85, 98, 111); }
    ink(); doc.setFont('helvetica', 'bold'); doc.setFontSize(20); T(bizName(), M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); gray();
    var by = y + 17; [b.phone, b.address, b.email].filter(Boolean).forEach(function(s){ doc.splitTextToSize(pdfSafe(s), 300).forEach(function(t){ T(t, M, by); by += 13; }); });
    ink(); doc.setFont('helvetica', 'bold'); doc.setFontSize(22); T('FACTURE', R, y, {align:'right'});
    doc.setFontSize(11); T(v.number || 'BROUILLON', R, y + 18, {align:'right'});
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); gray(); T('Date : ' + dateMed(v.issuedAt || today()), R, y + 33, {align:'right'});
    y = Math.max(by, y + 40) + 10;
    doc.setDrawColor(242, 178, 0); doc.setLineWidth(3); doc.line(M, y, R, y); y += 26;
    var colW = (R - M) / 2 - 12, x2 = M + (R - M) / 2 + 12;
    function block(x, label, rows){
      var yy = y; doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); gray(); T(label, x, yy); yy += 15;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); ink();
      rows.filter(Boolean).forEach(function(r){ doc.splitTextToSize(pdfSafe(r), colW).forEach(function(t){ T(t, x, yy); yy += 14; }); });
      return yy;
    }
    var yL = block(M, 'FACTURÉ À', [c.name, c.phone, addrFull(c), c.email]);
    var yR = block(x2, 'VÉHICULE', [vehLabel(j), veh.vin ? 'VIN : ' + veh.vin : '', veh.plate ? 'Plaque : ' + veh.plate : '', veh.km ? 'Kilométrage : ' + veh.km + ' km' : '']);
    y = Math.max(yL, yR) + 14;
    var xQ = R - 190, xP = R - 100, dW = xQ - M - 40;
    function header(){
      doc.setFillColor(236, 239, 242); doc.rect(M, y, R - M, 22, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); ink();
      T('DESCRIPTION', M + 8, y + 14); T('QTÉ', xQ, y + 14, {align:'right'}); T('PRIX', xP, y + 14, {align:'right'}); T('MONTANT', R - 8, y + 14, {align:'right'});
      y += 34;
    }
    header();
    (v.lines || []).forEach(function(l){
      var dl = doc.splitTextToSize(pdfSafe(l.desc), dW), hgt = dl.length * 13 + 14;
      if (y + hgt > H - 80){ doc.addPage(); y = 64; header(); }
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); ink();
      dl.forEach(function(t, k){ T(t, M + 8, y + k * 13); });
      T(fmtQty(l.qty) + (l.type === 'mo' ? ' h' : ''), xQ, y, {align:'right'}); T(money(l.price), xP, y, {align:'right'}); T(money(lineAmt(l)), R - 8, y, {align:'right'});
      doc.setFontSize(8.5); gray(); T(LT[l.type] || '', M + 8, y + dl.length * 13);
      y += hgt; doc.setDrawColor(210, 217, 224); doc.setLineWidth(0.5); doc.line(M, y - 9, R, y - 9);
    });
    if (y > H - 190){ doc.addPage(); y = 64; }
    y += 8;
    var xl = R - 220;
    function trow(label, amount, big){
      doc.setFont('helvetica', big ? 'bold' : 'normal'); doc.setFontSize(big ? 14 : 10.5); big ? ink() : gray();
      T(label, xl, y); ink(); T(amount, R - 8, y, {align:'right'}); y += big ? 22 : 16;
    }
    trow('Sous-total', money(v.sub));
    if (v.taxesOn){ trow('TPS (5 %)', money(v.tps)); trow('TVQ (9,975 %)', money(v.tvq)); }
    doc.setDrawColor(20, 32, 43); doc.setLineWidth(1.2); doc.line(xl, y - 8, R, y - 8); y += 8;
    trow('Total', money(v.total), true);
    y += 6;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    if (v.paid){ doc.setTextColor(27, 110, 69); T('PAYÉE - ' + v.method + ' - ' + dateMed(v.paidAt), M, y); }
    else { doc.setTextColor(143, 84, 0); T('MONTANT DÛ : ' + money(v.total), M, y); }
    y += 24;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); gray();
    var ids = [cf.tpsNo ? 'No TPS : ' + cf.tpsNo : '', cf.tvqNo ? 'No TVQ : ' + cf.tvqNo : ''].filter(Boolean).join('     ');
    if (ids){ T(ids, M, y); y += 16; }
    [v.note, cf.footer].filter(Boolean).forEach(function(p){ doc.splitTextToSize(pdfSafe(p), R - M).forEach(function(t){ if (y > H - 50){ doc.addPage(); y = 64; } T(t, M, y); y += 13; }); y += 6; });
    return doc.output('blob');
  });
}
function safeName(s){ return String(s || '').replace(/[\\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60); }

  return write('jobs/' + j.id, function(){ return S.db.doc('jobs/' + j.id).update(patch); }, ex && typeof ex.onStatus === 'function' ? '' : ST[v]).then(function(ok){ if (ok && ex && typeof ex.onStatus === 'function') ex.onStatus(j, v, was); return ok; });
}
/* cancelling asks for the amount lost; no-show asks to confirm */
function statusAct(v){ var j = findJob(S.jobId); if (!j) return; if (v === 'annule') openCancel(j); else if (v === 'noshow') openNoShow(j); else changeStatus(v); }

/* ---------- cancel (amount lost, in negative), no-show (trace for next time), work done ---------- */
var WHY = [['client', 'Le client a annulé'], ['garage', 'Le garage a annulé'], ['meteo', 'Météo'], ['autre', 'Autre']];
function svcAmt(n){ var cp = catalogPrice(n); if (cp != null) return cp; var t = svcHours([n])[0], rate = num(cfg().rate); return t && rate ? r2(t.h * rate) : 0; }
function amtTxt(x){ return r2(x).toFixed(2).replace('.', ','); }
function jobWork(j){ return Array.isArray(j.done) ? j.done.filter(Boolean) : jobServices(j); }
function noShowsOf(cid){ return cid ? S.jobs.filter(function(j){ return j.clientId === cid && j.status === 'noshow'; }).sort(byWhen) : []; }
function nsDates(list){ return list.map(function(j){ return dShort(j.date); }).join(', '); }
function offRow(){ return '<div class="offrow"><button type="button" class="btn ghost" data-act="cancel">Annuler la job</button><button type="button" class="btn ghost" data-act="noshow">No-show</button></div>'; }
function offBanner(j){
  if (j.status === 'noshow') return '<div class="banner warn"><p><b>No-show</b> : le client n\'était pas là. Aucun montant compté. Ça reste dans sa fiche : la prochaine fois, prends une carte au dossier.</p></div>';
  var L = j.lost || {}, why = (WHY.filter(function(w){ return w[0] === L.reason; })[0] || [])[1];
  return '<div class="banner warn"><p><b>Annulée</b>' + (why ? ' · ' + esc(why.toLowerCase()) : '') + (L.amount ? ' · perte de <b>' + esc(money(L.amount)) + '</b>' : '') + (L.note ? '<br><span class="small">' + esc(L.note) + '</span>' : '') + '</p></div>';
}
function openCancel(j){
  if (!j) return; S.jobId = j.id; S.cxWhy = (j.lost && j.lost.reason) || ''; S.cxEdited = false;
  var names = jobWork(j), tot = r2(names.reduce(function(s0, n){ return s0 + svcAmt(n); }, 0));
  var rows = names.map(function(n, i){ var a = svcAmt(n); return '<label class="cx-row"><input type="checkbox" class="cx-svc" value="' + i + '" data-amt="' + a + '" checked><span>' + esc(n) + '</span><b class="num">' + esc(money(a)) + '</b></label>'; }).join('');
  var h = '<div class="stack"><p>Le montant prévu est noté en <b>perte</b> (en négatif) dans tes chiffres. Décoche ce qui ne compte pas ou change le montant.</p>' +
    (rows ? '<div class="cx-list" role="group" aria-label="Services prévus">' + rows + '</div>' : '') +
    '<div class="field"><label for="cx-amt">Montant perdu</label><div class="cx-amt"><b aria-hidden="true">−</b><input id="cx-amt" inputmode="decimal" autocomplete="off" value="' + amtTxt(tot) + '"><span aria-hidden="true">$</span></div></div>' +
    '<div class="field"><span class="lbl">Pourquoi ?</span><div class="chips" role="group" aria-label="Raison">' + WHY.map(function(w){ return chip('cx-why', w[0], w[1], S.cxWhy === w[0]); }).join('') + '</div></div>' +
    '<div class="field"><label for="cx-note">Note (optionnel)</label><input id="cx-note" autocomplete="off" placeholder="Ex. a trouvé un autre garage"></div>' +
    '<div class="grid2"><button type="button" class="btn" data-act="sheet-close">Garder la job</button><button type="button" class="btn danger solid" data-act="cx-yes">Annuler la job</button></div></div>';
  openSheet('Annuler la job', (cl(j).name || 'Client') + ' · ' + cap(dShort(j.date)) + ' · ' + hm(j.time), h);
  $('#cx-amt').addEventListener('input', function(){ S.cxEdited = true; });
  $$('.cx-svc').forEach(function(cb){ cb.addEventListener('change', function(){ if (S.cxEdited) return; var t0 = 0; $$('.cx-svc').forEach(function(x){ if (x.checked) t0 += num(x.dataset.amt); }); $('#cx-amt').value = amtTxt(t0); }); });
}
function confirmCancel(){
  var j = findJob(S.jobId); if (!j){ closeSheet(); return; }
  var names = jobWork(j), picked = $$('.cx-svc').filter(function(x){ return x.checked; }).map(function(x){ return names[+x.value]; });
  var lost = {amount:-Math.abs(r2(num(val('cx-amt')))), services:picked, reason:S.cxWhy || '', note:val('cx-note'), at:Date.now()};
  closeSheet();
  changeStatus('annule', {lost:lost});
}
function openNoShow(j){
  if (!j) return; S.jobId = j.id;
  var prev = noShowsOf(j.clientId).filter(function(x){ return x.id !== j.id; }).length;
  openSheet('No-show', (cl(j).name || 'Client') + ' · ' + cap(dShort(j.date)) + ' · ' + hm(j.time),
    '<div class="stack"><p>Le client n\'était pas là ? La job est marquée <b>No-show</b>. Aucun montant n\'est compté.</p>' +
    '<p>' + (j.clientId ? 'Ça reste noté dans sa fiche' + (prev ? ' (' + (prev + 1) + '<sup>e</sup> fois)' : '') + ' : la prochaine fois, prends une <b>carte au dossier</b> avant de confirmer.' : 'Ce client n\'a pas de fiche : crée-la pour garder la trace.') + '</p>' +
    '<div class="grid2"><button type="button" class="btn" data-act="sheet-close">Retour</button><button type="button" class="btn danger solid" data-act="ns-yes">Marquer no-show</button></div></div>');
}
function doneHTML(j, w){
  var has = Array.isArray(j.done), list = jobWork(j);
  return (list.length ? '<div class="tags">' + list.map(function(n){ return '<span class="tag">' + esc(n) + '</span>'; }).join('') + '</div>' : '<p class="muted">Aucun travail indiqué.</p>') +
    (has ? '' : '<p class="muted small">Pas encore confirmé par le mécano : c\'est ce qui était réservé.</p>') +
    (w && !isOff(j) ? '<button type="button" class="btn' + (has ? ' sm' : '') + '" data-act="done-edit">' + (has ? 'Modifier les travaux faits' : 'Indiquer les travaux faits') + '</button>' : '');
}
function openDone(j, finish){
  if (!j) return; S.jobId = j.id; S.doneFinish = !!finish;
  PK.picked = jobWork(j).slice(); PK.active = -1;
  var h = '<div class="stack"><p class="small">' + (finish ? 'Avant de terminer : garde ce que tu as fait, retire le reste, ajoute ce qui manque. Ça remplit la facture.' : 'Ce que tu as vraiment fait. Ça remplit la facture.') + '</p>' +
    '<div class="field"><label for="f-svc-in">Travaux faits</label><div class="picker" id="svc-picker"><div class="picked" id="svc-picked"></div><input id="f-svc-in" role="combobox" aria-expanded="false" aria-controls="svc-opts" aria-autocomplete="list" autocomplete="off" enterkeyhint="done"></div>' +
    '<div class="opts" id="svc-opts" role="listbox" aria-label="Choix de services" hidden></div><div class="hint">Tape pour chercher ou ajouter un travail ; le ✕ le retire.</div><p class="muted small done-amt" id="done-amt" aria-live="polite"></p></div>' +
    '<div class="grid2"><button type="button" class="btn" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-act="done-save">' + (finish ? 'Terminer la job' : 'Enregistrer') + '</button></div></div>';
  openSheet('Travaux faits', [vehLabel(j), cl(j).name].filter(Boolean).join(' · '), h);
  bindPicker(); renderPicked();
}
function doneAmt(){ var el = $('#done-amt'); if (!el) return; var t0 = r2(PK.picked.reduce(function(s0, n){ return s0 + svcAmt(n); }, 0)); el.textContent = PK.picked.length ? 'Montant prévu : ' + money(t0) + ' avant taxes' : 'Aucun travail : ajoute au moins une ligne.'; }
function saveDone(){
  var j = findJob(S.jobId); if (!j){ closeSheet(); return; }
  var left = val('f-svc-in'); if (left && !PK.picked.some(function(n){ return norm(n) === norm(left); })) PK.picked.push(left);
  var done = PK.picked.slice(), fin = S.doneFinish;
  closeSheet();
  if (fin && j.status !== 'termine') changeStatus('termine', {done:done, doneAt:Date.now()});
  else write('jobs/' + j.id, function(){ return S.db.doc('jobs/' + j.id).update({done:done, doneAt:Date.now(), updatedAt:Date.now()}); }, 'Travaux faits enregistrés');
}
/* what the team version may use (absent extension = nothing happens) */
window.__garageApi = Object.freeze({S:S, render:render, toast:toast, findJob:findJob, findClient:findClient, cfg:cfg, mechanics:mechanics, esc:esc, hm:hm, money:money,
  bizName:bizName, dayLong:dayLong, dShort:dShort, today:today, jobServices:jobServices, cl:cl, addrFull:addrFull, clientName:clientName, telHref:telHref, fmtPhone:fmtPhone,
  topBack:topBack, banners:banners, pill:pill, norm:norm, canWrite:canWrite, canAdmin:canAdmin, lockedMech:lockedMech, ST:ST, phone:phone, changeStatus:changeStatus});
boot();
})();
