    return (/^\s/.test(src) ? ' ' : '') + r + (/\s$/.test(src) || (/['’]$/.test(s) && /[A-Za-z]$/.test(r)) ? ' ' : '');   /* (« l' » glued to the next word in French: a space in English) */
  }
  I.t = function(s, lg){ return (lg || I.lang) === 'en' && s != null ? tr(String(s)) : s; };

  /* ---- on the screen ---- */
  var SKIP = 'script,style,textarea,code,pre,[translate="no"],.notr,[contenteditable="true"],[contenteditable=""]';
  var ATTRS = ['placeholder', 'title', 'aria-label', 'alt'];
  var seen = typeof WeakMap === 'function' ? new WeakMap() : null;
  var collect = W.__i18nCollect || null, bag = {}, bagN = 0;
  function note(s){ if (!collect) return; var k = norm(s); if (!k || bag[k] || !/[A-Za-zÀ-ÿ0-9]/.test(k)) return; bag[k] = 1; bagN++; }
  function want(el){ var c = el && el.closest ? el.closest('[data-lang]') : null; return c ? c.getAttribute('data-lang') : I.lang; }
  function doText(n, lg){
    var cur = n.data;
    if (!cur || !/[A-Za-zÀ-ÿ0-9]/.test(cur)) return;
    var o = seen && seen.get(n), fr = o && cur === o.out ? o.fr : cur;
    note(fr);
    var out = (lg || want(n.parentNode)) === 'en' ? tr(fr) : fr;
    if (out === fr && !o) return;
    if (seen) seen.set(n, {fr: fr, out: out});
    if (out !== cur) n.data = out;
  }
  function doAttrs(el, lg){
    if (!el.hasAttribute) return;
    for (var i = 0; i < ATTRS.length; i++){
      var a = ATTRS[i]; if (!el.hasAttribute(a)) continue;
      var v = el.getAttribute(a), all = seen && seen.get(el) || {}, o = all[a], fr = o && v === o.out ? o.fr : v;
      note(fr);
      var out = (lg || want(el)) === 'en' ? tr(fr) : fr;
      if (out === fr && !o) continue;
      all[a] = {fr: fr, out: out}; if (seen) seen.set(el, all);
      if (out !== v) el.setAttribute(a, out);
    }
  }
  var NOATTR = '[translate="no"],.notr';
  var FILTER = {acceptNode: function(n){
    if (n.nodeType !== 1) return 1;
    var t = n.nodeName;
    if (t === 'TEXTAREA'){ doAttrs(n); return 2; }   /* (what is written in a box is his: only its hint is translated) */
    return t === 'SCRIPT' || t === 'STYLE' || t === 'CODE' || t === 'PRE' || n.getAttribute('translate') === 'no' || (n.classList && n.classList.contains('notr')) || n.isContentEditable ? 2 : 1;
  }};
  function walk(root){
    if (!root) return;
    if (root.nodeType === 3){ var p = root.parentNode; if (p && p.nodeType === 1 && !p.closest(SKIP)) doText(root); return; }
    if (root.nodeType !== 1) return;
    if (root.nodeName === 'TEXTAREA' && !root.closest(NOATTR)){ doAttrs(root); return; }
    if (root.closest && root.closest(SKIP)) return;
    var base = want(root), langs = !!root.querySelector('[data-lang]');
    doAttrs(root, base);
    var tw = D.createTreeWalker(root, 5, FILTER, false);
    for (var n = tw.nextNode(); n; n = tw.nextNode()){
      if (n.nodeType === 3) doText(n, langs ? null : base); else doAttrs(n, langs ? null : base);
    }
  }
  function busy(){ return I.lang === 'en' || collect; }
  var mo = new MutationObserver(function(list){
    if (!busy()){   /* in French: only the parts that have their own language (an invoice in English) */
      if (D.querySelector('[data-lang="en"]')) Array.prototype.forEach.call(D.querySelectorAll('[data-lang="en"]'), walk);
      return;
    }
    for (var i = 0; i < list.length; i++){
      var m = list[i];
      if (m.type === 'childList'){ for (var j = 0; j < m.addedNodes.length; j++) if (m.addedNodes[j].isConnected !== false) walk(m.addedNodes[j]); }
      else if (m.type === 'characterData') walk(m.target);
      else if (m.type === 'attributes' && m.target.closest && !m.target.closest(NOATTR) && !/^(SCRIPT|STYLE)$/.test(m.target.nodeName)) doAttrs(m.target);
    }
  });
  mo.observe(D.documentElement, {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS});
  function all(){ walk(D.documentElement); if (!busy()) Array.prototype.forEach.call(D.querySelectorAll('[data-lang="en"]'), walk); }
  if (busy()) all();
  D.addEventListener('DOMContentLoaded', function(){ if (busy() || D.querySelector('[data-lang="en"]')) all(); });
  /* the original French text of an element (what the code wrote) */
  I.fr = function(el){
    if (!el) return '';
    if (el.nodeType === 3){ var o = seen && seen.get(el); return o && el.data === o.out ? o.fr : el.data; }
    var s = '', tw = D.createTreeWalker(el, 4, null, false);
    for (var n = tw.nextNode(); n; n = tw.nextNode()) s += I.fr(n);
    return s;
  };
  /* change the language: everything on the screen at once, then the app redraws */
  I.set = function(lg, quiet, keep){   /* keep: not remembered as his choice (the language on a client's file) */
    if (lg !== 'en' && lg !== 'fr') return;
    var was = I.lang; I.lang = lg; if (!keep){ I.chosen = true; ls(KEY, lg); } htmlLang();
    if (was !== lg){ walk(D.documentElement); if (!quiet) try { W.dispatchEvent(new CustomEvent('i18n', {detail: lg})); } catch(e){} }
  };
  /* (to gather every text shown during the tests: sent to a local collector) */
  function flush(){ if (!bagN) return; var a = Object.keys(bag); bag = {}; bagN = 0; try { navigator.sendBeacon(collect, JSON.stringify(a)); } catch(e){} }
  if (collect){ setInterval(flush, 1000); W.addEventListener('pagehide', flush); }
})();
</script>
</head>
<body>
<header class="head"><div class="in">
  <div class="langbar" role="group" aria-label="Langue / Language" translate="no"><button type="button" data-lang-set="fr" lang="fr">Français</button><button type="button" data-lang-set="en" lang="en">English</button></div>
  <div class="eyebrow" id="garage">Suivi en direct</div>
  <h1 id="title">Chargement…</h1>
  <div class="eta" id="eta" hidden><b id="eta-time"></b><span id="eta-left"></span></div>
  <div class="state" id="state" hidden><i aria-hidden="true"></i><span id="state-txt"></span></div>
  <p class="note" id="note" hidden></p>
</div></header>
<div id="map" role="region" aria-label="Carte du trajet"></div>
<p class="foot" id="foot">Cette page se met à jour toute seule.</p>
<script src="config.js"></script>
<script src="vendor/leaflet.js"></script>
<script>
(function(){
  var CFG = window.GARAGE_CFG || {}, token = (location.hash.match(/t=([A-Za-z0-9_-]{20,})/) || [])[1];
  var $ = function(id){ return document.getElementById(id); };
  var TF = new Intl.DateTimeFormat('fr-CA', {hour:'numeric', minute:'2-digit'});
  var map = null, me = null, home = null, line = null, fitted = false, timer = null, stopped = false, asking = false;
  function clock(d){ return TF.format(d).replace(/\s/g, ' '); }
  function dist(a, b){ var R = 6371000, r = Math.PI / 180, x = Math.pow(Math.sin((b.lat - a.lat) * r / 2), 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.pow(Math.sin((b.lon - a.lon) * r / 2), 2); return 2 * R * Math.asin(Math.sqrt(x)); }
  function show(id, on){ $(id).hidden = !on; }
  function stop(title, note){
    stopped = true; clearTimeout(timer);
    $('title').textContent = title; show('eta', false); show('state', false);
    $('note').textContent = note || ''; show('note', !!note);
    $('foot').textContent = 'Le suivi est terminé.';
    if (me && map){ map.removeLayer(me); me = null; } if (line && map){ map.removeLayer(line); line = null; }
  }
  function ensureMap(){
    if (map || !window.L) return;
    map = L.map('map', {zoomControl:true}).setView([45.53, -73.62], 12);
    map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);
  }
  function icon(cls, txt, s){ return L.divIcon({className:'pin-wrap', html:'<span class="pin ' + cls + '">' + txt + '</span>', iconSize:[s, s], iconAnchor:[s / 2, s / 2]}); }
  /* what is left of the planned road from where the mechanic is now */
  function remaining(pos, d){
    var route = d.route || [];
    if (route.length > 1 && d.km && d.minutes){
      var best = 1e9, bi = 0; for (var i = 0; i < route.length; i++){ var dd = dist(pos, {lat:route[i][1], lon:route[i][0]}); if (dd < best){ best = dd; bi = i; } }
      if (best < 400){
        var m = best; for (var k = bi; k < route.length - 1; k++) m += dist({lat:route[k][1], lon:route[k][0]}, {lat:route[k + 1][1], lon:route[k + 1][0]});
        var totalM = 0; for (var q = 0; q < route.length - 1; q++) totalM += dist({lat:route[q][1], lon:route[q][0]}, {lat:route[q + 1][1], lon:route[q + 1][0]});
        var share = totalM > 0 ? m / totalM : 1;
        return {km:d.km * share, min:d.minutes * share, path:[[pos.lat, pos.lon]].concat(route.slice(bi + 1).map(function(c){ return [c[1], c[0]]; }))};
      }
    }
    if (!d.dest) return null;
    var kmLeft = dist(pos, d.dest) * 1.35 / 1000;
    return {km:kmLeft, min:kmLeft / 30 * 60 + 2, path:[[pos.lat, pos.lon], [d.dest.lat, d.dest.lon]]};
  }
  function draw(d){
    var name = d.mech || 'Votre mécano';
    $('garage').textContent = d.garage || 'Suivi en direct';
    document.title = name + ' est en route';
    if (d.status === 'arrived') return stop(name + ' est arrivé', d.ended_at ? 'Arrivé à ' + clock(new Date(d.ended_at)) + '. Bon service !' : 'Bon service !');
    if (d.status === 'cancelled') return stop('Le suivi a été arrêté', 'Le garage vous contactera au besoin.');
    if (d.status === 'expired') return stop('Ce lien n\'est plus actif', 'Le suivi s\'arrête automatiquement après quelques heures.');
    $('title').textContent = (d.client ? 'Bonjour ' + d.client + ', ' : '') + name + ' est en route';
    ensureMap();
    var pts = [];
    if (d.dest && map){ if (!home) home = L.marker([d.dest.lat, d.dest.lon], {icon:icon('home', '⌂', 36), title:'Chez vous'}).addTo(map); pts.push([d.dest.lat, d.dest.lon]); }
    var pos = d.pos, left = null;
    if (pos){
      var fresh = (Date.parse(d.now) - Date.parse(pos.at)) / 1000;
      left = remaining(pos, d);
      if (map){
        if (!me) me = L.marker([pos.lat, pos.lon], {icon:icon('', '🚐', 42), title:name, zIndexOffset:500}).addTo(map); else me.setLatLng([pos.lat, pos.lon]);
        if (left){ if (!line) line = L.polyline(left.path, {color:'#1D4B77', weight:6, opacity:.85, lineCap:'round'}).addTo(map); else line.setLatLngs(left.path); }
        pts.push([pos.lat, pos.lon]);
      }
      $('state-txt').textContent = fresh < 90 ? 'Position en direct' : 'Dernière position il y a ' + Math.round(fresh / 60) + ' min';
      $('state').className = 'state' + (fresh < 90 ? '' : ' warn'); show('state', true);
      show('note', false);
    } else {
      $('note').textContent = name + ' vient de partir. Sa position s\'affichera dès que son téléphone l\'envoie.'; show('note', true); show('state', false);
    }
    var eta = left ? new Date(Date.now() + left.min * 60000) : d.eta_at ? new Date(d.eta_at) : null;
    if (eta){
      $('eta-time').textContent = clock(eta);
      $('eta-left').textContent = 'arrivée prévue' + (left ? ' · environ ' + Math.max(1, Math.round(left.min)) + ' min · ' + (Math.round(left.km * 10) / 10).toLocaleString('fr-CA') + ' km' : '');
      show('eta', true);
    } else show('eta', false);
    if (map && pts.length && !fitted){ fitted = true; if (pts.length === 1) map.setView(pts[0], 14); else map.fitBounds(L.latLngBounds(pts).pad(0.25), {maxZoom:16}); }
    $('foot').textContent = 'Mis à jour à ' + clock(new Date()) + ' · la page se met à jour toute seule.';
  }
  /* one request at a time: coming back to the page while one is on its way does not start a second loop.
     A request with no answer after 15 s is dropped and asked again (otherwise the page would never update again);
     on an older phone that cannot cancel it, its late answer is simply ignored. */
  function poll(){
    if (stopped || asking) return;
    asking = true;
    var h = {'Content-Type':'application/json', apikey:CFG.key};
    if (/^eyJ/.test(CFG.key || '')) h.Authorization = 'Bearer ' + CFG.key;
    var ac = window.AbortController ? new AbortController() : null, over = false;
    var cut = setTimeout(function(){ if (over) return; over = true; asking = false; if (ac) ac.abort(); $('foot').textContent = 'Connexion lente : on réessaie…'; timer = setTimeout(poll, 3000); }, 15000);
    fetch(CFG.url + '/rest/v1/rpc/get_track', {method:'POST', headers:h, body:JSON.stringify({p_token:token}), cache:'no-store', signal:ac ? ac.signal : undefined}).then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); }).then(function(d){
      if (over) return; over = true; asking = false; clearTimeout(cut);
      if (!d) return stop('Lien de suivi introuvable', 'Vérifiez le lien reçu par texto.');
      draw(d);
      timer = setTimeout(poll, document.visibilityState === 'hidden' ? 30000 : 10000);
    }, function(){
      if (over) return; over = true; asking = false; clearTimeout(cut);
      $('foot').textContent = 'Connexion perdue : on réessaie…';
      timer = setTimeout(poll, 15000);
    });
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && !stopped){ clearTimeout(timer); poll(); } });
  if (!token || !CFG.url) return stop('Lien de suivi incomplet', 'Vérifiez le lien reçu par texto.');
  /* the page's language: the client's own choice, otherwise the one on his file at the garage (in the link), otherwise his phone's */
  function langMark(){ var l = window.I18N ? I18N.lang : 'fr'; Array.prototype.forEach.call(document.querySelectorAll('[data-lang-set]'), function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang-set') === l)); }); }
  document.addEventListener('click', function(ev){ var b = ev.target.closest('[data-lang-set]'); if (!b || !window.I18N) return; I18N.set(b.getAttribute('data-lang-set')); langMark(); });
  langMark();
  poll();
})();
</script>
</body>
</html>
