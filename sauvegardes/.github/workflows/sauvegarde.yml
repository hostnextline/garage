name: Sauvegarde de la nuit
on:
  schedule:
    - cron: '17 7 * * *'     # chaque nuit à 2 h 17 (heure de Montréal ; 3 h 17 en été)
  workflow_dispatch: {}       # bouton « Run workflow » pour une copie tout de suite
  push:                       # et une copie dès qu’on change la façon de sauvegarder
    branches: [main]
    paths: ['sauvegarder.py', '.github/workflows/sauvegarde.yml']
permissions:
  contents: write
  id-token: write        # GitHub signe l'exécution : le serveur du garage n'accepte que ce dépôt
concurrency:
  group: sauvegarde
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copier le carnet
        env:
          SUPABASE_URL: https://vaddqzejagdvexlmjelr.supabase.co
          SUPABASE_ANON: sb_publishable_9yyQBkNVH7_3hp5Ctw6hjw_ouQQZf93     # clé publique (la même que sur le site) : elle n'ouvre rien seule
        run: python3 sauvegarder.py
      - name: Garder la copie
        run: |
          git config user.name "Sauvegarde du garage"
          git config user.email "host.nextline@gmail.com"
          git add -A sauvegarde recus photos
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -q -m "Sauvegarde $(date -u +%Y-%m-%d)"
          git push
